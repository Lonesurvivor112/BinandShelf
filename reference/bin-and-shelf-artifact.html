<title>Bin & Shelf</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F1F4F2;
    --surface:#FFFFFF;
    --surface-2:#F7F9F8;
    --ink:#14201D;
    --muted:#5C6D68;
    --faint:#8A9B95;
    --line:#D7E0DC;
    --line-strong:#BCC9C4;
    --accent:#1B6B57;
    --accent-ink:#FFFFFF;
    --accent-soft:#E2EFE9;
    --signal:#A75F16;
    --signal-soft:#F6E9D8;
    --danger:#A5342B;
    --danger-soft:#F7E2E0;
    --shadow:0 1px 2px rgba(20,32,29,.06), 0 8px 24px -12px rgba(20,32,29,.22);
    --radius:12px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1412;
      --surface:#18211E;
      --surface-2:#1E2825;
      --ink:#E9F0EC;
      --muted:#9BACA6;
      --faint:#748782;
      --line:#2A3733;
      --line-strong:#3A4A45;
      --accent:#4FC0A0;
      --accent-ink:#06211A;
      --accent-soft:#15302A;
      --signal:#E0A362;
      --signal-soft:#332518;
      --danger:#E98A80;
      --danger-soft:#33201E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1412;
    --surface:#18211E;
    --surface-2:#1E2825;
    --ink:#E9F0EC;
    --muted:#9BACA6;
    --faint:#748782;
    --line:#2A3733;
    --line-strong:#3A4A45;
    --accent:#4FC0A0;
    --accent-ink:#06211A;
    --accent-soft:#15302A;
    --signal:#E0A362;
    --signal-soft:#332518;
    --danger:#E98A80;
    --danger-soft:#33201E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3{font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; background:none; border:none; padding:0}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace}
  .wrap{max-width:720px; margin:0 auto; padding-inline:16px}

  /* ---------- header ---------- */
  header.bar{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:40;
    background:color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-row{display:flex; align-items:center; gap:10px; padding-block:10px}
  .brandmark{
    width:30px;height:30px;flex:none;border-radius:7px;
    background:var(--accent); color:var(--accent-ink);
    display:grid;place-items:center;
  }
  .brandmark svg{width:17px;height:17px;display:block}
  .brand{
    font-family:"Archivo",sans-serif; font-weight:700; font-size:16px;
    letter-spacing:.02em; text-transform:uppercase; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .iconbtn{
    width:34px;height:34px;flex:none;border-radius:9px;
    display:grid;place-items:center; color:var(--muted);
    border:1px solid transparent;
  }
  .iconbtn:hover{background:var(--surface); border-color:var(--line); color:var(--ink)}
  .iconbtn svg{width:18px;height:18px}

  .searchrow{padding-bottom:10px; display:flex; gap:8px}
  .searchbox{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:0 10px; min-height:42px;
  }
  .searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbox svg{width:16px;height:16px;flex:none;color:var(--faint)}
  .searchbox input{
    flex:1; border:none; background:none; outline:none;
    font-size:16px; /* keeps iOS from zooming on focus */
    min-width:0; padding:8px 0;
  }
  .searchbox input::placeholder{color:var(--faint)}
  .clearbtn{color:var(--faint); font-size:20px; line-height:1; padding:4px 2px}

  /* ---------- crumb ---------- */
  .crumb{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:12px; color:var(--muted); padding-block:12px 4px;
  }
  .crumb button{color:var(--accent); font-weight:600}
  .crumb .sep{color:var(--faint)}

  /* ---------- generic blocks ---------- */
  .screen{padding-block:8px 24px}
  .sectionhead{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin:22px 0 10px;
  }
  .sectionhead:first-child{margin-top:12px}
  .eyebrow{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase; color:var(--faint);
  }
  .linkbtn{color:var(--accent); font-weight:600; font-size:13px}

  .stats{
    display:flex; gap:0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-top:12px;
  }
  .stat{flex:1; padding:12px 10px; text-align:center; border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat b{display:block; font-family:"Archivo",sans-serif; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums}
  .stat span{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-family:"IBM Plex Mono",monospace}

  /* rows: locations */
  .rows{display:flex; flex-direction:column; gap:8px}
  .row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; min-height:56px;
  }
  .row:hover{border-color:var(--line-strong)}
  .row .rmain{flex:1; min-width:0}
  .row .rtitle{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .rsub{font-size:12.5px; color:var(--muted); margin-top:1px}
  .row .chev{color:var(--faint); flex:none}
  .row .chev svg{width:16px;height:16px;display:block}
  .tally{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    color:var(--muted); background:var(--surface-2); border:1px solid var(--line);
    border-radius:999px; padding:3px 9px; flex:none; font-variant-numeric:tabular-nums;
  }

  /* container card */
  .cards{display:grid; gap:8px}
  .card{
    display:block; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px;
  }
  .card:hover{border-color:var(--line-strong)}
  .card-top{display:flex; align-items:center; gap:9px; margin-bottom:3px}
  .code{
    font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
    letter-spacing:.05em; color:var(--signal); background:var(--signal-soft);
    border-radius:5px; padding:2px 6px; flex:none;
  }
  .card-name{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card-sub{font-size:12.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .dot{color:var(--faint)}
  .peek{
    font-size:12.5px; color:var(--faint); margin-top:6px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* container detail */
  .detail-head{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:6px;
  }
  .detail-head h2{font-size:22px; font-weight:700; margin:6px 0 6px}
  .meta{display:flex; flex-direction:column; gap:7px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
  .meta div{display:flex; gap:10px; font-size:13px; align-items:flex-start}
  .meta dt{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--faint); width:74px; flex:none; padding-top:2px;
  }
  .meta dd{margin:0; color:var(--ink); flex:1; min-width:0; overflow-wrap:anywhere}
  .headacts{display:flex; gap:8px; margin-top:14px}

  .items{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .item{display:flex; align-items:center; gap:10px; background:var(--surface); padding:11px 13px; min-height:48px}
  .qty{
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    color:var(--accent); background:var(--accent-soft); border-radius:5px;
    padding:2px 7px; flex:none; font-variant-numeric:tabular-nums;
  }
  .item .iname{flex:1; min-width:0; overflow-wrap:anywhere}
  .item .inote{display:block; font-size:12px; color:var(--muted); margin-top:1px}
  .xbtn{color:var(--faint); flex:none; width:30px; height:30px; display:grid; place-items:center; border-radius:7px}
  .xbtn:hover{color:var(--danger); background:var(--danger-soft)}
  .xbtn svg{width:15px;height:15px}

  .quickadd{display:flex; gap:8px; margin-top:10px}
  .quickadd input{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:16px; outline:none;
  }
  .quickadd input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:10px; padding:11px 15px; font-weight:600; font-size:14px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    min-height:44px;
  }
  .btn:hover{border-color:var(--line-strong)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{color:var(--danger); border-color:var(--line)}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 12px; min-height:38px; font-size:13px}

  /* empty state */
  .empty{
    border:1px dashed var(--line-strong); border-radius:var(--radius);
    padding:26px 18px; text-align:center; color:var(--muted);
  }
  .empty h3{font-size:16px; color:var(--ink); margin-bottom:6px}
  .empty p{margin:0 0 14px; font-size:13.5px}

  /* banner */
  .banner{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--signal-soft); border:1px solid color-mix(in srgb, var(--signal) 30%, transparent);
    border-radius:var(--radius); padding:11px 13px; font-size:13px; color:var(--ink); margin-top:12px;
  }
  .banner p{margin:0; flex:1; min-width:180px}
  .banner strong{color:var(--signal)}

  /* bottom bar */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:45;
    background:color-mix(in srgb, var(--ground) 94%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .dock-inner{display:flex; gap:8px; padding-block:10px}
  .dock .btn{flex:1}

  /* sheet */
  .scrim{
    position:fixed; inset:0; z-index:60; background:rgba(12,20,18,.42);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; transition:opacity .16s ease;
  }
  .scrim.on{opacity:1}
  .sheet{
    width:100%; max-width:560px; background:var(--surface);
    border-radius:16px 16px 0 0; border:1px solid var(--line); border-bottom:none;
    box-shadow:var(--shadow); max-height:88vh; overflow-y:auto;
    padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    transform:translateY(14px); transition:transform .18s ease;
  }
  .scrim.on .sheet{transform:translateY(0)}
  @media (prefers-reduced-motion: reduce){
    .scrim,.sheet{transition:none}
  }
  @media (min-width:640px){
    .scrim{align-items:center; padding:20px}
    .sheet{border-radius:16px; border-bottom:1px solid var(--line)}
  }
  .grip{width:34px;height:4px;border-radius:2px;background:var(--line-strong); margin:9px auto 4px}
  .sheet h3{font-size:18px; font-weight:700; margin:8px 0 14px}
  .field{margin-bottom:13px}
  .field label{
    display:block; font-family:"IBM Plex Mono",monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:16px; outline:none;
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:68px; line-height:1.45}
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--surface);
  }
  .field .hint{font-size:12px; color:var(--faint); margin-top:5px}
  .duo{display:flex; gap:10px}
  .duo .field{flex:1}
  .sheet-acts{display:flex; gap:8px; margin-top:16px}
  .sheet-acts .btn{flex:1}
  .sheet .prose{font-size:13.5px; color:var(--muted); line-height:1.6}
  .sheet .prose ol{padding-left:20px; margin:8px 0}
  .sheet .prose li{margin-bottom:5px}
  .sheet .prose strong{color:var(--ink)}

  /* toast */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%) translateY(8px);
    bottom:calc(88px + env(safe-area-inset-bottom, 0px)); z-index:70;
    background:var(--ink); color:var(--ground);
    padding:10px 15px; border-radius:999px; font-size:13px; font-weight:500;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    max-width:calc(100vw - 32px); text-align:center;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  .mark{background:var(--signal-soft); color:var(--signal); border-radius:3px; padding:0 1px; font-weight:600}
  .loading{text-align:center; color:var(--muted); padding:48px 0; font-size:14px}
</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <span class="brandmark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M9 12h6"/></svg>
      </span>
      <span class="brand">Bin &amp; Shelf</span>
      <button class="iconbtn" id="btn-help" aria-label="Setup and export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="searchrow">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search every item, bin and note" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search the inventory">
        <button class="clearbtn" id="q-clear" hidden aria-label="Clear search">&times;</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap screen" id="screen">
  <div class="loading">Opening your inventory&hellip;</div>
</main>

<nav class="dock">
  <div class="wrap dock-inner">
    <button class="btn" id="dock-loc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      New place
    </button>
    <button class="btn primary" id="dock-bin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      New container
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ---------------- icons ---------------- */
  var I = {
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'
  };

  /* ---------------- state ---------------- */
  var S = {
    db:null,
    downloads:null,
    ready:false,
    fatal:null,
    places:[],
    bins:[],
    view:{name:'home'},
    stack:[],
    q:'',
    busy:false
  };

  var screen = document.getElementById('screen');
  var qInput = document.getElementById('q');
  var qClear = document.getElementById('q-clear');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function uid(){
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'').slice(0,16); } catch(e){}
    return 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
  }
  function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function placeById(id){
    for (var i=0;i<S.places.length;i++) if (S.places[i].id === id) return S.places[i];
    return null;
  }
  function binById(id){
    for (var i=0;i<S.bins.length;i++) if (S.bins[i].id === id) return S.bins[i];
    return null;
  }
  function binsIn(placeId){
    return S.bins.filter(function(b){ return b.placeId === placeId; })
      .sort(function(a,b){ return (a.code||'').localeCompare(b.code||'') || (a.name||'').localeCompare(b.name||''); });
  }
  function itemCount(b){ return (b.items || []).length; }
  function totalItems(){
    return S.bins.reduce(function(n,b){ return n + itemCount(b); }, 0);
  }
  function sortedPlaces(){
    return S.places.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  }

  /* label code: three letters of the place + a running number, e.g. GAR-03 */
  function makeCode(placeName){
    var pre = String(placeName || '').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
    while (pre.length < 3) pre += 'X';
    var taken = {};
    S.bins.forEach(function(b){ if (b.code) taken[b.code] = 1; });
    var n = 1;
    while (taken[pre + '-' + String(n).padStart(2,'0')]) n++;
    return pre + '-' + String(n).padStart(2,'0');
  }

  /* ---------------- navigation ---------------- */
  function go(view){
    S.stack.push(S.view);
    S.view = view;
    window.scrollTo(0,0);
    render();
  }
  function back(){
    S.view = S.stack.pop() || {name:'home'};
    window.scrollTo(0,0);
    render();
  }
  function home(){
    S.stack = [];
    S.view = {name:'home'};
    window.scrollTo(0,0);
    render();
  }

  /* ---------------- search ---------------- */
  function searchAll(qRaw){
    var q = qRaw.trim().toLowerCase();
    var itemHits = [], binHits = [];
    if (!q) return {items:itemHits, bins:binHits};
    S.bins.forEach(function(b){
      var hay = [b.name, b.code, b.spot, b.notes, b.kind].join(' ').toLowerCase();
      if (hay.indexOf(q) !== -1) binHits.push(b);
      (b.items || []).forEach(function(it){
        var ih = [it.name, it.note].join(' ').toLowerCase();
        if (ih.indexOf(q) !== -1) itemHits.push({item:it, bin:b});
      });
    });
    itemHits.sort(function(a,b){ return a.item.name.localeCompare(b.item.name); });
    binHits.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    return {items:itemHits, bins:binHits};
  }
  function highlight(text, q){
    var t = String(text == null ? '' : text);
    var needle = q.trim().toLowerCase();
    if (!needle) return esc(t);
    var i = t.toLowerCase().indexOf(needle);
    if (i === -1) return esc(t);
    return esc(t.slice(0,i)) + '<mark class="mark">' + esc(t.slice(i, i+needle.length)) + '</mark>' + esc(t.slice(i+needle.length));
  }

  /* ---------------- rendering ---------------- */
  function render(){
    if (S.fatal){ screen.innerHTML = S.fatal; return; }
    if (!S.ready){ screen.innerHTML = '<div class="loading">Opening your inventory&hellip;</div>'; return; }

    if (S.q.trim()) { screen.innerHTML = viewSearch(); return; }

    var v = S.view;
    if (v.name === 'place'){
      var p = placeById(v.id);
      if (!p) { home(); return; }
      screen.innerHTML = viewPlace(p);
    } else if (v.name === 'bin'){
      var b = binById(v.id);
      if (!b) { home(); return; }
      screen.innerHTML = viewBin(b);
    } else if (v.name === 'all'){
      screen.innerHTML = viewAllBins();
    } else {
      screen.innerHTML = viewHome();
    }
  }

  function crumb(parts){
    var h = '<nav class="crumb">';
    parts.forEach(function(p, i){
      if (i) h += '<span class="sep">/</span>';
      if (p.act) h += '<button data-act="' + p.act + '"' + (p.id ? ' data-id="' + esc(p.id) + '"' : '') + '>' + esc(p.label) + '</button>';
      else h += '<span>' + esc(p.label) + '</span>';
    });
    return h + '</nav>';
  }

  function sampleBanner(){
    var hasSample = S.bins.some(function(b){ return b.sample; }) || S.places.some(function(p){ return p.sample; });
    if (!hasSample) return '';
    return '<div class="banner">' +
      '<p><strong>Example data.</strong> Two places and three containers are here to show the shape of things. Clear them whenever you\'re ready.</p>' +
      '<button class="btn sm" data-act="clear-samples">Clear examples</button></div>';
  }

  function viewHome(){
    var places = sortedPlaces();
    var h = '';
    h += '<div class="stats">' +
      '<div class="stat"><b>' + places.length + '</b><span>Places</span></div>' +
      '<div class="stat"><b>' + S.bins.length + '</b><span>Containers</span></div>' +
      '<div class="stat"><b>' + totalItems() + '</b><span>Items</span></div>' +
      '</div>';
    h += sampleBanner();

    if (!places.length && !S.bins.length){
      h += '<div class="sectionhead"><span class="eyebrow">Get started</span></div>';
      h += '<div class="empty"><h3>Nothing catalogued yet</h3>' +
        '<p>Start with a place you store things &mdash; the garage, the attic, a storage unit &mdash; then add the bins and boxes inside it.</p>' +
        '<button class="btn primary" data-act="new-place">' + I.plus + ' Add your first place</button></div>';
      return h;
    }

    h += '<div class="sectionhead"><span class="eyebrow">Places</span>' +
         '<button class="linkbtn" data-act="new-place">Add place</button></div>';
    h += '<div class="rows">';
    places.forEach(function(p){
      var bs = binsIn(p.id);
      var items = bs.reduce(function(n,b){ return n + itemCount(b); }, 0);
      h += '<button class="row" data-act="open-place" data-id="' + esc(p.id) + '">' +
        '<span class="rmain"><span class="rtitle">' + esc(p.name) + '</span>' +
        '<span class="rsub">' + plural(bs.length, 'container') + ' &middot; ' + plural(items, 'item') + '</span></span>' +
        '<span class="tally">' + bs.length + '</span>' +
        '<span class="chev">' + I.chev + '</span></button>';
    });
    h += '</div>';

    var loose = S.bins.filter(function(b){ return !placeById(b.placeId); });
    if (loose.length){
      h += '<div class="sectionhead"><span class="eyebrow">Unfiled containers</span></div><div class="cards">';
      loose.forEach(function(b){ h += binCard(b); });
      h += '</div>';
    }

    if (S.bins.length){
      h += '<div class="sectionhead"><span class="eyebrow">Everything</span></div>';
      h += '<button class="row" data-act="open-all"><span class="rmain">' +
        '<span class="rtitle">All containers</span>' +
        '<span class="rsub">Browse the full list, newest changes first</span></span>' +
        '<span class="chev">' + I.chev + '</span></button>';
    }
    return h;
  }

  function binCard(b, q){
    var p = placeById(b.placeId);
    var n = itemCount(b);
    var peek = (b.items || []).slice(0,4).map(function(i){ return i.name; }).join(', ');
    if (n > 4) peek += ', +' + (n - 4) + ' more';
    var sub = [];
    if (p) sub.push(esc(p.name));
    if (b.spot) sub.push(esc(b.spot));
    return '<button class="card" data-act="open-bin" data-id="' + esc(b.id) + '">' +
      '<span class="card-top">' +
        (b.code ? '<span class="code mono">' + esc(b.code) + '</span>' : '') +
        '<span class="card-name">' + (q ? highlight(b.name, q) : esc(b.name)) + '</span>' +
        '<span class="tally">' + n + '</span>' +
      '</span>' +
      (sub.length ? '<span class="card-sub">' + sub.join(' <span class="dot">&middot;</span> ') + '</span>' : '') +
      (peek ? '<span class="peek">' + esc(peek) + '</span>' : '<span class="peek">Empty &mdash; nothing listed inside yet</span>') +
      '</button>';
  }

  function viewPlace(p){
    var bs = binsIn(p.id);
    var h = crumb([{label:'Places', act:'home'}, {label:p.name}]);
    h += '<div class="sectionhead"><h2 style="font-size:24px">' + esc(p.name) + '</h2>' +
      '<button class="linkbtn" data-act="edit-place" data-id="' + esc(p.id) + '">Edit</button></div>';
    h += '<p style="color:var(--muted); font-size:13px; margin:0 0 14px">' +
      plural(bs.length, 'container') + ' &middot; ' +
      plural(bs.reduce(function(n,b){ return n + itemCount(b); }, 0), 'item') + '</p>';

    if (!bs.length){
      h += '<div class="empty"><h3>No containers here yet</h3>' +
        '<p>Add the first bin, box or shelf you keep in ' + esc(p.name) + '.</p>' +
        '<button class="btn primary" data-act="new-bin" data-id="' + esc(p.id) + '">' + I.plus + ' Add a container</button></div>';
    } else {
      h += '<div class="cards">';
      bs.forEach(function(b){ h += binCard(b); });
      h += '</div>';
      h += '<div style="margin-top:12px"><button class="btn wide" data-act="new-bin" data-id="' + esc(p.id) + '">' + I.plus + ' Add a container here</button></div>';
    }
    h += '<div style="margin-top:22px"><button class="btn danger sm" data-act="del-place" data-id="' + esc(p.id) + '">' + I.trash + ' Delete this place</button></div>';
    return h;
  }

  function viewAllBins(){
    var bs = S.bins.slice().sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    var h = crumb([{label:'Places', act:'home'}, {label:'All containers'}]);
    h += '<div class="sectionhead"><span class="eyebrow">' + plural(bs.length,'container') + '</span></div>';
    h += '<div class="cards">';
    bs.forEach(function(b){ h += binCard(b); });
    h += '</div>';
    return h;
  }

  function viewBin(b){
    var p = placeById(b.placeId);
    var items = (b.items || []);
    var h = crumb([
      {label:'Places', act:'home'},
      p ? {label:p.name, act:'open-place', id:p.id} : {label:'Unfiled'},
      {label:b.name}
    ]);

    h += '<div class="detail-head">';
    if (b.code) h += '<span class="code mono">' + esc(b.code) + '</span>';
    h += '<h2>' + esc(b.name) + '</h2>';
    h += '<div class="meta">';
    h += '<div><dt>Place</dt><dd>' + esc(p ? p.name : 'Not assigned') + '</dd></div>';
    if (b.spot) h += '<div><dt>Exactly</dt><dd>' + esc(b.spot) + '</dd></div>';
    if (b.kind) h += '<div><dt>Type</dt><dd>' + esc(b.kind) + '</dd></div>';
    if (b.notes) h += '<div><dt>Notes</dt><dd>' + esc(b.notes) + '</dd></div>';
    h += '<div><dt>Contents</dt><dd>' + plural(items.length, 'item') + '</dd></div>';
    h += '</div>';
    h += '<div class="headacts">' +
      '<button class="btn sm" data-act="edit-bin" data-id="' + esc(b.id) + '">' + I.pen + ' Edit</button>' +
      '<button class="btn sm danger" data-act="del-bin" data-id="' + esc(b.id) + '">' + I.trash + ' Delete</button>' +
      '</div>';
    h += '</div>';

    h += '<div class="sectionhead"><span class="eyebrow">What\'s inside</span></div>';

    if (items.length){
      h += '<div class="items">';
      items.forEach(function(it){
        h += '<div class="item">' +
          '<span class="qty mono">' + esc(it.qty || 1) + '</span>' +
          '<span class="iname"><button data-act="edit-item" data-id="' + esc(b.id) + '" data-item="' + esc(it.id) + '" style="text-align:left">' +
            esc(it.name) + '</button>' +
            (it.note ? '<span class="inote">' + esc(it.note) + '</span>' : '') +
          '</span>' +
          '<button class="xbtn" data-act="del-item" data-id="' + esc(b.id) + '" data-item="' + esc(it.id) + '" aria-label="Remove ' + esc(it.name) + '">' + I.x + '</button>' +
          '</div>';
      });
      h += '</div>';
    } else {
      h += '<div class="empty" style="padding:20px 16px"><h3>Nothing listed yet</h3>' +
        '<p>Type what\'s in this container below &mdash; one line each.</p></div>';
    }

    h += '<form class="quickadd" id="quickadd">' +
      '<input id="quick-name" type="text" placeholder="Add an item&hellip;" autocomplete="off" aria-label="Add an item to this container">' +
      '<button class="btn primary" type="submit">Add</button></form>';
    h += '<p style="font-size:12px;color:var(--faint);margin-top:8px">Tap an item name to set a quantity or a note.</p>';
    return h;
  }

  function viewSearch(){
    var q = S.q;
    var r = searchAll(q);
    var h = '<div class="sectionhead"><span class="eyebrow">Results for &ldquo;' + esc(q.trim()) + '&rdquo;</span>' +
      '<button class="linkbtn" data-act="clear-q">Clear</button></div>';

    if (!r.items.length && !r.bins.length){
      h += '<div class="empty"><h3>No match</h3><p>Nothing in the inventory mentions &ldquo;' + esc(q.trim()) + '&rdquo;. ' +
        'Try a shorter word, or check a container you haven\'t listed the contents of yet.</p></div>';
      return h;
    }

    if (r.items.length){
      h += '<div class="sectionhead"><span class="eyebrow">' + plural(r.items.length,'item') + '</span></div>';
      h += '<div class="rows">';
      r.items.forEach(function(hit){
        var p = placeById(hit.bin.placeId);
        var where = (hit.bin.code ? hit.bin.code + ' &middot; ' : '') + esc(hit.bin.name) +
          (p ? ' <span class="dot">&middot;</span> ' + esc(p.name) : '') +
          (hit.bin.spot ? ' <span class="dot">&middot;</span> ' + esc(hit.bin.spot) : '');
        h += '<button class="row" data-act="open-bin" data-id="' + esc(hit.bin.id) + '">' +
          '<span class="qty mono">' + esc(hit.item.qty || 1) + '</span>' +
          '<span class="rmain"><span class="rtitle">' + highlight(hit.item.name, q) + '</span>' +
          '<span class="rsub">' + where + '</span></span>' +
          '<span class="chev">' + I.chev + '</span></button>';
      });
      h += '</div>';
    }

    if (r.bins.length){
      h += '<div class="sectionhead"><span class="eyebrow">' + plural(r.bins.length,'container') + '</span></div>';
      h += '<div class="cards">';
      r.bins.forEach(function(b){ h += binCard(b, q); });
      h += '</div>';
    }
    return h;
  }

  /* ---------------- sheets ---------------- */
  var openScrim = null;
  function sheet(inner, onMount){
    closeSheet();
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>' + inner + '</div>';
    document.body.appendChild(scrim);
    openScrim = scrim;
    requestAnimationFrame(function(){ scrim.classList.add('on'); });
    scrim.addEventListener('click', function(e){ if (e.target === scrim) closeSheet(); });
    if (onMount) onMount(scrim);
    var first = scrim.querySelector('input, textarea, select');
    if (first && window.matchMedia('(min-width: 640px)').matches) first.focus();
  }
  function closeSheet(){
    if (openScrim && openScrim.parentNode) openScrim.parentNode.removeChild(openScrim);
    openScrim = null;
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

  function placeOptions(selected){
    var o = '';
    sortedPlaces().forEach(function(p){
      o += '<option value="' + esc(p.id) + '"' + (p.id === selected ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    });
    return o;
  }

  function placeSheet(existing){
    var title = existing ? 'Rename place' : 'New place';
    sheet(
      '<h3>' + title + '</h3>' +
      '<div class="field"><label for="f-place">Name</label>' +
      '<input id="f-place" type="text" value="' + esc(existing ? existing.name : '') + '" placeholder="Garage, attic, unit 214&hellip;">' +
      '<p class="hint">A room, building or rented unit &mdash; the big bucket. Shelves and bins go inside it.</p></div>' +
      '<div class="sheet-acts"><button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn primary" id="f-save">' + (existing ? 'Save' : 'Add place') + '</button></div>',
      function(scrim){
        scrim.querySelector('[data-close]').onclick = closeSheet;
        scrim.querySelector('#f-save').onclick = function(){
          var name = scrim.querySelector('#f-place').value.trim();
          if (!name) { toast('Give the place a name first.'); return; }
          if (existing) savePlace(existing.id, {name:name});
          else addPlace(name);
        };
        scrim.querySelector('#f-place').addEventListener('keydown', function(e){
          if (e.key === 'Enter') scrim.querySelector('#f-save').click();
        });
      }
    );
  }

  function binSheet(existing, presetPlace){
    var hasPlaces = S.places.length > 0;
    var title = existing ? 'Edit container' : 'New container';
    var pid = existing ? existing.placeId : (presetPlace || (sortedPlaces()[0] && sortedPlaces()[0].id));
    var placeField = hasPlaces
      ? '<div class="field"><label for="f-place">Place</label><select id="f-place">' + placeOptions(pid) + '</select></div>'
      : '<div class="field"><label for="f-newplace">Place</label><input id="f-newplace" type="text" placeholder="Garage"><p class="hint">No places yet &mdash; this creates one.</p></div>';

    sheet(
      '<h3>' + title + '</h3>' +
      '<div class="field"><label for="f-name">What is it</label>' +
      '<input id="f-name" type="text" value="' + esc(existing ? existing.name : '') + '" placeholder="Christmas decorations"></div>' +
      placeField +
      '<div class="duo">' +
        '<div class="field"><label for="f-kind">Type</label>' +
        '<select id="f-kind">' +
          ['Tote / bin','Cardboard box','Shelf','Drawer','Cabinet','Bag','Rack','Pallet','Other'].map(function(k){
            return '<option' + ((existing && existing.kind === k) ? ' selected' : '') + '>' + k + '</option>';
          }).join('') +
        '</select></div>' +
        '<div class="field"><label for="f-spot">Exact spot</label>' +
        '<input id="f-spot" type="text" value="' + esc(existing ? (existing.spot||'') : '') + '" placeholder="Shelf B, 2nd from top"></div>' +
      '</div>' +
      '<div class="field"><label for="f-notes">Notes</label>' +
      '<textarea id="f-notes" placeholder="Red lid, heavy, fragile ornaments on top">' + esc(existing ? (existing.notes||'') : '') + '</textarea></div>' +
      (existing && existing.code ? '<p class="hint" style="margin:-4px 0 12px">Label code <strong class="mono">' + esc(existing.code) + '</strong> &mdash; write it on tape and stick it on the real container.</p>' : '') +
      '<div class="sheet-acts"><button class="btn" data-close="1">Cancel</button>' +
      '<button class="btn primary" id="f-save">' + (existing ? 'Save' : 'Add container') + '</button></div>',
      function(scrim){
        scrim.querySelector('[data-close]').onclick = closeSheet;
        scrim.querySelector('#f-save').onclick = function(){
          var name = scrim.querySelector('#f-name').value.trim();
          if (!name) { toast('Give the container a name first.'); return; }
          var payload = {
            name: name,
            kind: scrim.querySelector('#f-kind').value,
            spot: scrim.querySelector('#f-spot').value.trim(),
            notes: scrim.querySelector('#f-notes').value.trim()
          };
          if (hasPlaces) payload.placeId = scrim.querySelector('#f-place').value;
          if (existing) saveBin(existing.id, payload);
          else {
            var newPlaceName = hasPlaces ? null : scrim.querySelector('#f-newplace').value.trim();
            addBin(payload, newPlaceName);
          }
        };
      }
    );
  }

  function itemSheet(binId, item){
    var b = binById(binId);
    if (!b) return;
    sheet(
      '<h3>' + (item ? 'Edit item' : 'Add item') + '</h3>' +
      '<div class="duo">' +
        '<div class="field" style="flex:3"><label for="f-iname">Item</label>' +
        '<input id="f-iname" type="text" value="' + esc(item ? item.name : '') + '" placeholder="Tree topper"></div>' +
        '<div class="field" style="flex:1"><label for="f-qty">Qty</label>' +
        '<input id="f-qty" type="number" inputmode="numeric" min="1" value="' + esc(item ? (item.qty||1) : 1) + '"></div>' +
      '</div>' +
      '<div class="field"><label for="f-inote">Note</label>' +
      '<input id="f-inote" type="text" value="' + esc(item ? (item.note||'') : '') + '" placeholder="Glass, wrapped in newspaper"></div>' +
      '<div class="sheet-acts">' +
        (item ? '<button class="btn danger" id="f-del">' + I.trash + ' Remove</button>' : '<button class="btn" data-close="1">Cancel</button>') +
        '<button class="btn primary" id="f-save">Save</button></div>',
      function(scrim){
        var close = scrim.querySelector('[data-close]');
        if (close) close.onclick = closeSheet;
        var del = scrim.querySelector('#f-del');
        if (del) del.onclick = function(){ removeItem(binId, item.id); };
        scrim.querySelector('#f-save').onclick = function(){
          var name = scrim.querySelector('#f-iname').value.trim();
          if (!name) { toast('Name the item first.'); return; }
          var qty = parseInt(scrim.querySelector('#f-qty').value, 10);
          if (!qty || qty < 1) qty = 1;
          var note = scrim.querySelector('#f-inote').value.trim();
          if (item) updateItem(binId, item.id, {name:name, qty:qty, note:note});
          else addItem(binId, name, qty, note);
        };
      }
    );
  }

  function helpSheet(){
    sheet(
      '<h3>Keep it on your phone</h3>' +
      '<div class="prose">' +
      '<p>This page works as a home-screen app on iOS:</p>' +
      '<ol>' +
      '<li>Open this link in <strong>Safari</strong> (not inside another app).</li>' +

      '<button class="btn primary" data-close="1">Done</button></div>',
      function(scrim){
        scrim.querySelector('[data-close]').onclick = closeSheet;
        var ex = scrim.querySelector('#f-export');
        if (!S.downloads) { ex.disabled = true; ex.style.opacity = .5; ex.title = 'Not available in this view'; }
        else ex.onclick = exportCsv;

  function confirmSheet(title, body, label, fn){
    sheet(
      '<h3>' + esc(title) + '</h3>' +
      '<div class="prose"><p>' + body + '</p></div>' +
      '<div class="sheet-acts"><button class="btn" data-close="1">Keep it</button>' +
      '<button class="btn danger" id="f-go">' + esc(label) + '</button></div>',
      function(scrim){
        scrim.querySelector('[data-close]').onclick = closeSheet;
        scrim.querySelector('#f-go').onclick = fn;
      }
    );

  /* ---------------- writes ---------------- */
  function guard(){
    if (!S.db){ toast('Not connected to the inventory store.'); return false; }
    if (S.busy){ return false; }
    return true;
  }
  function failed(e){
    S.busy = false;
    var code = (e && e.code) || '';
    if (code === 'quota_exceeded') toast('This inventory is full. Delete something first.');
    else if (code === 'invalid_argument') toast('You have view-only access here, so nothing was saved.');
    else if (code === 'resource_exhausted') toast('Too many changes at once — try again in a moment.');
    else toast('Could not save. Try again.');
  }

  function addPlace(name){
    if (!guard()) return;
    S.busy = true;
    S.db.collection('places').add({name:name, createdAt:Date.now()}).then(function(){
      S.busy = false; closeSheet(); toast('Added ' + name + '.');
    }, failed);
  }
  function savePlace(id, patch){
    if (!guard()) return;
    S.busy = true;
    S.db.doc('places/' + id).update(patch).then(function(){
      S.busy = false; closeSheet();
    }, failed);
  }
  function deletePlace(id){
    if (!guard()) return;
    var p = placeById(id);
    var kids = binsIn(id);
    S.busy = true;
    var chain = Promise.resolve();
    kids.forEach(function(b){
      chain = chain.then(function(){ return S.db.doc('containers/' + b.id).delete(); });
    });
    chain.then(function(){ return S.db.doc('places/' + id).delete(); }).then(function(){
      S.busy = false; closeSheet(); home();
      toast('Deleted ' + (p ? p.name : 'place') + '.');
    }, failed);
  }

  function addBin(payload, newPlaceName){
    if (!guard()) return;
    S.busy = true;
    var start = newPlaceName
      ? S.db.collection('places').add({name:newPlaceName, createdAt:Date.now()}).then(function(ref){ return ref.id; })
      : Promise.resolve(payload.placeId);
    start.then(function(pid){
      var p = placeById(pid);
      var doc = {
        name: payload.name,
        placeId: pid || '',
        kind: payload.kind || '',
        spot: payload.spot || '',
        notes: payload.notes || '',
        code: makeCode(p ? p.name : (newPlaceName || payload.name)),
        items: [],
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      return S.db.collection('containers').add(doc).then(function(ref){
        S.busy = false; closeSheet();
        S.bins.push(Object.assign({id:ref.id}, doc));
        go({name:'bin', id:ref.id});
        toast('Added ' + doc.name + ' (' + doc.code + ').');
      });
    }).catch(failed);
  }
  function saveBin(id, patch){
    if (!guard()) return;
    S.busy = true;
    patch.updatedAt = Date.now();
    S.db.doc('containers/' + id).update(patch).then(function(){
      S.busy = false; closeSheet();
    }, failed);
  }
  function deleteBin(id){
    if (!guard()) return;
    var b = binById(id);
    S.busy = true;
    S.db.doc('containers/' + id).delete().then(function(){
      S.busy = false; closeSheet(); back();
      toast('Deleted ' + (b ? b.name : 'container') + '.');
    }, failed);
  }

  function writeItems(binId, items, done){
    if (!guard()) return;
    S.busy = true;
    S.db.doc('containers/' + binId).update({items:items, updatedAt:Date.now()}).then(function(){
      S.busy = false;
      if (done) done();
    }, failed);
  }
  function addItem(binId, name, qty, note){
    var b = binById(binId);
    if (!b) return;
    var items = (b.items || []).slice();
    items.push({id:uid(), name:name, qty:qty || 1, note:note || ''});
    writeItems(binId, items, function(){ closeSheet(); });
  }
  function updateItem(binId, itemId, patch){
    var b = binById(binId);
    if (!b) return;
    var items = (b.items || []).map(function(it){
      return it.id === itemId ? Object.assign({}, it, patch) : it;
    });
    writeItems(binId, items, function(){ closeSheet(); });
  }
  function removeItem(binId, itemId){
    var b = binById(binId);
    if (!b) return;
    var items = (b.items || []).filter(function(it){ return it.id !== itemId; });
    writeItems(binId, items, function(){ closeSheet(); });
  }

  function clearSamples(){
    if (!guard()) return;
    S.busy = true;
    var chain = Promise.resolve();
    S.bins.filter(function(b){ return b.sample; }).forEach(function(b){
      chain = chain.then(function(){ return S.db.doc('containers/' + b.id).delete(); });
    });
    S.places.filter(function(p){ return p.sample; }).forEach(function(p){
      chain = chain.then(function(){ return S.db.doc('places/' + p.id).delete(); });
    });
    chain.then(function(){
      S.busy = false; closeSheet(); home(); toast('Examples cleared.');
    }, failed);
  }

  function csvCell(v){
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  function exportCsv(){
    if (!S.downloads) return;
    var rows = [['Place','Container','Code','Type','Exact spot','Container notes','Item','Qty','Item note']];
    S.bins.slice().sort(function(a,b){ return (a.code||'').localeCompare(b.code||''); }).forEach(function(b){
      var p = placeById(b.placeId);
      var base = [p ? p.name : '', b.name, b.code || '', b.kind || '', b.spot || '', b.notes || ''];
      var items = b.items || [];
      if (!items.length) rows.push(base.concat(['', '', '']));
      else items.forEach(function(it){ rows.push(base.concat([it.name, it.qty || 1, it.note || ''])); });
    });
    var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
    var stamp = new Date().toISOString().slice(0,10);
    S.downloads.save({filename:'storage-inventory-' + stamp + '.csv', data:csv}).then(function(){
      toast('Backup saved.');
    }, function(e){
      if (e && e.code === 'declined') return;
      toast('Could not save the backup.');
    });
  }

  /* ---------------- events ---------------- */
  screen.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');
    var itemId = t.getAttribute('data-item');

    if (act === 'home') { home(); }
    else if (act === 'open-place') { go({name:'place', id:id}); }
    else if (act === 'open-bin') { clearQuery(true); go({name:'bin', id:id}); }
    else if (act === 'open-all') { go({name:'all'}); }
    else if (act === 'new-place') { placeSheet(null); }
    else if (act === 'edit-place') { placeSheet(placeById(id)); }
    else if (act === 'del-place') {
      var p = placeById(id), n = binsIn(id).length;
      confirmSheet('Delete ' + (p ? p.name : 'place') + '?',
        n ? 'Its <strong>' + n + '</strong> container' + (n===1?'':'s') + ' and everything listed inside will go too. This cannot be undone.'
          : 'Nothing is stored in it. This cannot be undone.',
        'Delete', function(){ deletePlace(id); });
    }
    else if (act === 'new-bin') { binSheet(null, id); }
    else if (act === 'edit-bin') { binSheet(binById(id)); }
    else if (act === 'del-bin') {
      var b = binById(id);
      confirmSheet('Delete ' + (b ? b.name : 'container') + '?',
        'The container and its ' + plural(b ? itemCount(b) : 0, 'item') + ' will be removed. This cannot be undone.',
        'Delete', function(){ deleteBin(id); });
    }
    else if (act === 'edit-item') {
      var bb = binById(id);
      var it = bb && (bb.items || []).filter(function(x){ return x.id === itemId; })[0];
      if (it) itemSheet(id, it);
    }
    else if (act === 'del-item') { removeItem(id, itemId); }
    else if (act === 'clear-q') { clearQuery(); }
    else if (act === 'clear-samples') {
      confirmSheet('Clear the examples?', 'The example places and containers will be deleted. Anything you added yourself stays.', 'Clear examples', clearSamples);
    }
  });

  screen.addEventListener('submit', function(e){
    if (e.target.id !== 'quickadd') return;
    e.preventDefault();
    var input = document.getElementById('quick-name');
    var name = input.value.trim();
    if (!name) return;
    if (S.view.name !== 'bin') return;
    input.value = '';
    addItem(S.view.id, name, 1, '');
  });

  function clearQuery(silent){
    S.q = '';
    qInput.value = '';
    qClear.hidden = true;
    if (!silent) render();
  }
  var qTimer;
  qInput.addEventListener('input', function(){
    S.q = qInput.value;
    qClear.hidden = !S.q;
    clearTimeout(qTimer);
    qTimer = setTimeout(render, 110);
  });
  qClear.addEventListener('click', function(){ clearQuery(); qInput.focus(); });

  document.getElementById('dock-loc').onclick = function(){ placeSheet(null); };
  document.getElementById('dock-bin').onclick = function(){
    binSheet(null, S.view.name === 'place' ? S.view.id : null);
  };
  document.getElementById('btn-help').onclick = helpSheet;

  /* ---------------- boot ---------------- */
  function offline(){
    S.fatal = '<div class="empty" style="margin-top:20px"><h3>Inventory unavailable</h3>' +
      '<p>This view can\'t reach the saved inventory. Open the page from your own Claude account and it will load.</p></div>';
    render();
  }

  if (!window.claude || !window.claude.use){ offline(); return; }

  window.claude.use('downloads').then(function(d){ S.downloads = d; }, function(){});

  window.claude.use('db').then(function(db){
    if (!db) { offline(); return; }
    S.db = db;
    var gotPlaces = false, gotBins = false;
    function maybeReady(){
      if (gotPlaces && gotBins && !S.ready){ S.ready = true; }
      if (S.ready) render();
    }
    db.collection('places').onSnapshot(function(snap){
      S.places = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      gotPlaces = true; maybeReady();
    }, function(){ gotPlaces = true; maybeReady(); });

    db.collection('containers').onSnapshot(function(snap){
      S.bins = snap.docs.map(function(d){
        var v = Object.assign({id:d.id}, d.data());
        if (!Array.isArray(v.items)) v.items = [];
        return v;
      });
      gotBins = true; maybeReady();
    }, function(){ gotBins = true; maybeReady(); });

    setTimeout(function(){ if (!S.ready){ S.ready = true; render(); } }, 6000);
  }, function(){ offline(); });
})();
</script>
